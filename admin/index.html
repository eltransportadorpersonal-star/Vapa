<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAPA | Administración</title><style>
:root{font-family:Arial,sans-serif;color:#21392e;background:#f4f7f2}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dbe5dc;padding:19px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:25px;letter-spacing:.12em}a{color:#2b684b}main{max-width:1100px;margin:34px auto;padding:0 18px}h1{font-size:34px;margin:5px 0 8px}p{line-height:1.5;color:#52675a}.panel{background:white;border:1px solid #dbe5dc;border-radius:15px;padding:23px;margin:20px 0}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid #dbe5dc;border-radius:12px;padding:18px}.stat b{display:block;font-size:27px;margin-top:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}button{cursor:pointer;border:1px solid #c5d6c9;background:white;border-radius:9px;padding:11px 15px;font-weight:700;color:#234532}button.active,button.primary{background:#265f43;color:white;border-color:#265f43}button.danger{color:#a13c32}button:disabled{opacity:.5;cursor:wait}input{width:100%;max-width:400px;padding:13px;border:1px solid #cbd8cf;border-radius:9px;margin:8px 0 15px}.item{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid #e3eae4}.item img{width:100%;height:170px;object-fit:cover;border-radius:10px}.photos{display:flex;gap:7px;overflow:auto;margin:12px 0}.photos img{width:100px;height:75px;object-fit:cover}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{font-size:13px;color:#647568}.error{color:#a13c32}.success{color:#276947}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body>
<header><strong>VAPA <span style="font-size:13px;letter-spacing:0;color:#6b7c70">/ ADMIN</span></strong><a href="/">Volver a VAPA ↗</a></header><main><div id="auth" class="panel"><h1>Acceso administrador</h1><p>Ingresa con tu cuenta de VAPA. Solo perfiles autorizados pueden ver este panel.</p><form id="login"><label>Correo electrónico<br><input type="email" id="email" required autocomplete="username"></label><br><label>Contraseña<br><input type="password" id="password" required autocomplete="current-password"></label><br><button class="primary" type="submit">Ingresar</button></form><p id="authMessage" role="status"></p></div>
<div id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="muted">CENTRO DE CONTROL</div><h1>Administración de propiedades</h1><p id="welcome"></p></div><button id="logout">Cerrar sesión</button></div><section class="stats" id="stats"></section><div class="tabs" id="tabs"></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="sectionTitle">Pendientes</h2><button id="refresh">Actualizar</button></div><p id="message" role="status"></p><div id="list"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
const db=window.supabase.createClient(VAPA_CONFIG.supabaseUrl,VAPA_CONFIG.supabaseAnonKey);let state='pending_review';let adminUser=null;const $=id=>document.getElementById(id);const labels={pending_review:'Pendientes',changes_requested:'Cambios solicitados',published:'Publicadas',rejected:'Rechazadas',draft:'Borradores'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verify(){const {data:{user},error}=await db.auth.getUser();if(error||!user){showLogin();return}const {data:profile,error:pe}=await db.from('profiles').select('role,full_name').eq('id',user.id).single();if(pe||profile?.role!=='admin'){await db.auth.signOut();showLogin('Tu cuenta no tiene permisos de administrador.');return}adminUser=user;$('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');$('welcome').textContent='Sesión: '+(profile.full_name||user.email);await load()}
function showLogin(message=''){$('dashboard').classList.add('hidden');$('auth').classList.remove('hidden');$('authMessage').textContent=message}
$('login').addEventListener('submit',async e=>{e.preventDefault();$('authMessage').textContent='Verificando acceso...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){showLogin(error.message);return}await verify()});$('logout').onclick=async()=>{await db.auth.signOut();showLogin('Sesión cerrada.')};$('refresh').onclick=()=>load();
async function load(){if(!adminUser)return;$('message').textContent='Cargando propiedades...';const {data,error}=await db.from('properties').select('id,name,commune,address,sqm,price_per_person,max_dogs,description,status,review_note,created_at,property_photos(url,sort_order)').order('created_at',{ascending:false});if(error){$('message').textContent='No se pudieron cargar las propiedades: '+error.message;return}const all=data||[];$('stats').replaceChildren();for(const [title,filter] of [['Total',()=>true],['Pendientes',p=>p.status==='pending_review'],['Publicadas',p=>p.status==='published'],['Solicitan cambios',p=>p.status==='changes_requested']]){const el=document.createElement('div');el.className='stat';el.innerHTML='<span>'+title+'</span><b>'+all.filter(filter).length+'</b>';$('stats').append(el)}$('tabs').replaceChildren();for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label+' ('+all.filter(p=>p.status===key).length+')';b.className=state===key?'active':'';b.onclick=()=>{state=key;render(all)};$('tabs').append(b)}render(all)}
function render(all){[...$('tabs').children].forEach((b,i)=>b.classList.toggle('active',Object.keys(labels)[i]===state));$('sectionTitle').textContent=labels[state];$('message').textContent='';$('list').replaceChildren();const filtered=all.filter(p=>p.status===state);if(!filtered.length){$('message').textContent='No hay propiedades en esta categoría.';return}for(const p of filtered){const article=document.createElement('article');article.className='item';const photos=(p.property_photos||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).filter(x=>x.url?.startsWith('https://'));const photo=document.createElement('div');const cover=document.createElement('img');cover.src=photos[0]?.url||'/assets/perros-parque.jpg';cover.alt='Fotografía de '+p.name;photo.append(cover);const info=document.createElement('div');info.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+esc(p.commune)+' · '+esc(p.sqm||'Sin medida')+' m² · $'+Number(p.price_per_person||0).toLocaleString('es-CL')+' por persona</p><p><strong>Dirección:</strong> '+esc(p.address)+'<br><strong>Máximo perros:</strong> '+esc(p.max_dogs)+'<br><strong>Descripción:</strong> '+esc(p.description)+'</p>'+(p.review_note?'<p><strong>Observaciones:</strong> '+esc(p.review_note)+'</p>':'');const gallery=document.createElement('div');gallery.className='photos';for(const pic of photos){const img=document.createElement('img');img.src=pic.url;img.alt='Foto del espacio';gallery.append(img)}info.append(gallery);const actions=document.createElement('div');actions.className='actions';for(const [label,next,cls] of [['Aprobar','published','primary'],['Solicitar cambios','changes_requested',''],['Rechazar','rejected','danger']]){if(p.status===next)continue;const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=()=>moderate(p,next,b);actions.append(b)}info.append(actions);article.append(photo,info);$('list').append(article)}}
async function moderate(p,next,button){let note=null;if(next!=='published'){note=prompt(next==='rejected'?'Motivo del rechazo:':'¿Qué debe corregir el propietario?');if(note===null)return;if(!note.trim()){alert('Debes ingresar una observación.');return}}else if(!confirm('¿Publicar '+p.name+' en VAPA?'))return;button.disabled=true;const {error}=await db.from('properties').update({status:next,review_note:note,reviewed_at:new Date().toISOString()}).eq('id',p.id);if(error){alert('No se pudo guardar: '+error.message);button.disabled=false;return}await load()}
verify();</script></body></html>
